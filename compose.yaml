services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: evalot
      POSTGRES_PASSWORD: evalot_local
      POSTGRES_DB: evalot
    ports: ["127.0.0.1:${DB_PORT:-55432}:5432"]
    volumes: ["evalot_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evalot -d evalot"]
      interval: 3s
      retries: 10
volumes:
  evalot_data:
